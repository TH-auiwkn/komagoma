<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>地球が何回回ったとき？</title>
<style>
  :root {
    --bg: #0b0f1a;
    --fg: #e6edf3;
    --accent: #58a6ff;
    --accent2: #7ee787;
    --muted: #8b949e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    background: radial-gradient(ellipse at top, #1a2a4f 0%, var(--bg) 60%);
    color: var(--fg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 20% 30%, #fff, transparent),
      radial-gradient(1px 1px at 60% 70%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 80% 20%, #fff, transparent),
      radial-gradient(1px 1px at 30% 80%, #fff, transparent),
      radial-gradient(1px 1px at 90% 50%, #fff, transparent),
      radial-gradient(1px 1px at 10% 60%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 50% 10%, #fff, transparent);
    opacity: 0.5;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 720px;
    width: 100%;
    text-align: center;
  }

  h1 {
    font-size: clamp(22px, 4vw, 32px);
    margin: 0 0 8px;
    letter-spacing: 0.02em;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 28px;
  }

  .earth {
    width: 120px;
    height: 120px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 30%, #7fd3ff 0%, #3a8bbd 30%, #1f4f7a 70%, #0d2a44 100%);
    box-shadow:
      inset -12px -12px 30px rgba(0, 0, 0, 0.6),
      0 0 40px rgba(88, 166, 255, 0.35);
    position: relative;
    animation: rotate 8s linear infinite;
  }
  .earth::before, .earth::after {
    content: "";
    position: absolute;
    background: rgba(126, 231, 135, 0.7);
    border-radius: 40%;
  }
  .earth::before {
    width: 45px; height: 30px;
    top: 25%; left: 15%;
    transform: rotate(-15deg);
    box-shadow: 40px 20px 0 -5px rgba(126, 231, 135, 0.6);
  }
  .earth::after {
    width: 35px; height: 22px;
    bottom: 20%; right: 20%;
    transform: rotate(25deg);
  }

  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .clock {
    font-variant-numeric: tabular-nums;
    font-size: clamp(28px, 6vw, 44px);
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .date {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 32px;
  }

  .card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 24px 20px;
    margin-bottom: 16px;
    backdrop-filter: blur(6px);
  }

  .card-label {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .count {
    font-variant-numeric: tabular-nums;
    font-size: clamp(22px, 4.5vw, 36px);
    font-weight: 700;
    color: var(--accent2);
    word-break: break-all;
    line-height: 1.25;
  }

  .count .unit {
    font-size: 0.55em;
    color: var(--muted);
    margin-left: 6px;
    font-weight: 400;
  }

  .note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 12px;
    line-height: 1.6;
  }

  footer {
    margin-top: 24px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
  }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="container">
    <h1>いつ言った？何時何分何秒？<br />地球が何回回ったとき？</h1>
    <p class="subtitle">現在の時刻から、地球が誕生してから回った回数を計算します。</p>

    <div class="earth" aria-hidden="true"></div>

    <div id="clock" class="clock">--:--:--</div>
    <div id="date" class="date">----年--月--日</div>

    <div class="card">
      <div class="card-label">地球が回った回数（単純計算：1日＝1回転）</div>
      <div id="simple" class="count">-<span class="unit">回</span></div>
    </div>

    <div class="card">
      <div class="card-label">地球が回った回数（自転の減速を考慮）</div>
      <div id="adjusted" class="count">-<span class="unit">回</span></div>
    </div>

    <footer>
      参考：柳田理科雄「地球は何回回ったか」<br />
      <a href="https://news.yahoo.co.jp/expert/articles/fccca38010c54f51d93d6b0e35b3e13225efc847" target="_blank" rel="noopener noreferrer">https://news.yahoo.co.jp/expert/articles/fccca38010c54f51d93d6b0e35b3e13225efc847</a><br />
      地球の年齢を46億年として計算しています。
    </footer>
  </div>

<script>
  // --- 定数 ---------------------------------------------------------------
  // 地球の年齢（46億年）
  const EARTH_AGE_YEARS = 4.6e9;
  // 1年の平均日数（ユリウス年）
  const DAYS_PER_YEAR = 365.25;
  // 記事の参考値：自転減速考慮の総回転数 / 単純計算の総回転数
  // 1,680,160,075,840 回（単純） / 3,118,451,504,961 回（減速考慮）
  const SLOWDOWN_RATIO = 3118451504961 / 1680160075840; // ≒ 1.856

  // --- ユーティリティ -----------------------------------------------------
  // 3桁区切りにする（整数部のみ）
  function formatWithCommas(numStr) {
    const [intPart, decPart] = numStr.split(".");
    const withCommas = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return decPart !== undefined ? `${withCommas}.${decPart}` : withCommas;
  }

  // 大きな数を安全に小数点以下まで文字列化する
  // (JS の Number は 2^53 を超えると精度が落ちるため、
  //  整数部は Math.floor で、小数部は別途計算して連結する)
  function bigNumberToString(value, decimals = 3) {
    const intPart = Math.floor(value);
    const fraction = value - intPart;
    const intStr = intPart.toLocaleString("en-US"); // カンマ区切り
    const fracStr = fraction.toFixed(decimals).slice(1); // ".123"
    return intStr + fracStr;
  }

  // 2桁ゼロ埋め
  const pad = (n) => String(n).padStart(2, "0");

  // --- メインの描画ループ -------------------------------------------------
  function update() {
    const now = new Date();

    // 時計表示
    const hh = pad(now.getHours());
    const mm = pad(now.getMinutes());
    const ss = pad(now.getSeconds());
    document.getElementById("clock").textContent = `${hh}:${mm}:${ss}`;

    // 日付表示
    const y = now.getFullYear();
    const mo = now.getMonth() + 1;
    const d = now.getDate();
    const week = ["日", "月", "火", "水", "木", "金", "土"][now.getDay()];
    document.getElementById("date").textContent = `${y}年${mo}月${d}日（${week}）`;

    // --- 地球の回転回数を計算 ---
    // 今日の0:00:00からの経過秒数（ミリ秒精度）
    const secondsToday =
      now.getHours() * 3600 +
      now.getMinutes() * 60 +
      now.getSeconds() +
      now.getMilliseconds() / 1000;
    const fractionalDay = secondsToday / 86400;

    // 今年の元旦からの経過日数
    const startOfYear = new Date(y, 0, 1);
    const dayOfYearIdx = Math.floor((now - startOfYear) / 86400000);

    // 地球誕生〜今年の元旦までの概算日数
    //  = 46億年 × 365.25日 - (今年までの年数 × 0.25日の誤差を含む概算)
    // 単純化のため「46億年分の日数 + 今年の経過日数 + 本日の経過秒/86400」で算出
    const totalDaysSimple =
      EARTH_AGE_YEARS * DAYS_PER_YEAR + dayOfYearIdx + fractionalDay;

    // 自転減速を考慮した回転回数
    const totalRotationsAdjusted = totalDaysSimple * SLOWDOWN_RATIO;

    // 表示（小数点以下3桁まで・リアルタイム更新）
    document.getElementById("simple").innerHTML =
      bigNumberToString(totalDaysSimple, 3) + '<span class="unit">回</span>';
    document.getElementById("adjusted").innerHTML =
      bigNumberToString(totalRotationsAdjusted, 3) + '<span class="unit">回</span>';
  }

  // 60fps 近い更新で小数点がスムーズに変わるようにする
  function tick() {
    update();
    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
</html>
